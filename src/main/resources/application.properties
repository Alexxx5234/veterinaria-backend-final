
# ==========================================================
# VETERINARIA ARÉVALO
# CONFIGURACIÓN GENERAL - LOCAL Y RAILWAY
# ==========================================================

spring.application.name=veterinaria

# BASE DE DATOS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SEGURIDAD SPRING
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# CORREO ELECTRÓNICO
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CONFIGURACIÓN PRIVADA LOCAL
# Este archivo está excluido de Git.
spring.config.import=optional:file:./application-local.properties

# JWT
# JwtService obtiene la clave desde:
# 1. app.jwt.secret del archivo privado local.
# 2. JWT_SECRET del entorno si no existe la anterior.
#
# No escribir aquí una clave real.
